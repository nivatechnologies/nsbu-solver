[package]
name = "p10-snapshot-comparison-adapter"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
nsbu-solver = { path = "../../../../crates/nsbu-solver" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
