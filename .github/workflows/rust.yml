name: Rust package and quality checks
"on":
  workflow_dispatch:
    inputs:
      full_mutation_report:
        description: "Run the optional complete cargo-mutants report"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".cargo/**"
      - "quality/rust/**"
      - ".github/workflows/rust.yml"
      - "quality/check_crap.py"
      - "benchmarks/**"
      - "docs/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
      - "project-status.json"
      - "evidence/**"
      - ".github/workflows/alpha-release.yml"
      - "CONTRIBUTING.md"
      - "reference/**"
      - "requirements-dev.txt"
      - "LICENSE"
      - "NOTICE"
      - ".gitattributes"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - ".cargo/**"
      - "quality/rust/**"
      - ".github/workflows/rust.yml"
      - "quality/check_crap.py"
      - "benchmarks/**"
      - "docs/**"
      - "README.md"
      - "IMPLEMENTATION_PLAN.md"
      - "project-status.json"
      - "evidence/**"
      - ".github/workflows/alpha-release.yml"
      - "CONTRIBUTING.md"
      - "reference/**"
      - "requirements-dev.txt"
      - "LICENSE"
      - "NOTICE"
      - ".gitattributes"
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchains and quality tools
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup toolchain install nightly-2026-03-03 --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo install rust-code-analysis-cli --version 0.0.25 --locked
          npm ci --prefix quality/rust --ignore-scripts
      - name: Build, lint, document and package public workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings -A dead_code
          cargo build --workspace --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
          cargo test --workspace --doc --locked
          cmp benchmarks/similarity-mms-v2.json crates/nsbu-benchmarks/data/similarity-mms-v2.json
          # A fresh temporary registry avoids stale same-version package cache entries.
          package_target=$(mktemp -d)
          cargo package --workspace --locked --target-dir "$package_target"
          cargo install --path crates/nsbu-cli --locked --root work/install
          work/install/bin/nsbu --help
          work/install/bin/nsbu --version
          work/install/bin/nsbu v2 --dry-run > work/v2-preflight.json
          work/install/bin/nsbu v2 > work/v2-cm.json
          work/install/bin/nsbu v2 --method ho > work/v2-ho.json
          work/install/bin/nsbu v2 --method ho --checkpoint work/v2.chk --checkpoint-after 16 > work/v2-saved.json
          work/install/bin/nsbu resume-v2 --method ho --checkpoint work/v2.chk > work/v2-resumed.json
          python - <<'PYTHON'
          import json
          from pathlib import Path
          reports = {name: json.loads(Path(f"work/v2-{name}.json").read_text())
                     for name in ("cm", "ho", "resumed")}
          for report in reports.values():
              assert report["status"] == "completed" and report["accepted_pde_windows"] == 0
          expected = reports["ho"]
          resumed = reports["resumed"]
          assert expected.pop("origin_status") == "internal_from_rest"
          assert resumed.pop("origin_status") == "external_unverified"
          assert expected == resumed
          PYTHON
      - name: 80 percent executable line and instrumented branch coverage
        run: |
          mkdir -p work
          # This executes every workspace test and example once with coverage.
          cargo +nightly-2026-03-03 llvm-cov --workspace --all-targets --branch --no-default-ignore-filename-regex --ignore-filename-regex '(/rustc/|/\.cargo/registry/|/\.rustup/toolchains/|/target/)' --json --output-path work/rust-coverage.json
          jq -e '.data[0].totals | .lines.count > 0 and .branches.count > 0 and .lines.percent >= 80 and .branches.percent >= 80' work/rust-coverage.json
          jq '.data[0].totals | {lines, branches, functions}' work/rust-coverage.json
      - name: Per-function metrics and complete file scope
        run: |
          rust-code-analysis-cli -p crates -m -O json > work/rust-metrics.json
          jq -se '[.. | objects | select(.kind? == "function") | .metrics.cyclomatic.sum] | length > 0 and max < 22' work/rust-metrics.json
          jq -se '[.. | objects | select(.kind? == "function") | .metrics.cognitive.sum] | max < 22' work/rust-metrics.json
          jq -se '[.. | objects | select(has("metrics")) | .metrics.halstead.difficulty | select(. != null)] | max < 80' work/rust-metrics.json
          git ls-files 'crates/*.rs' > work/rust-source-files.txt
          test -s work/rust-source-files.txt
          while IFS= read -r path; do awk 'END { exit !(NR < 500) }' "$path"; done < work/rust-source-files.txt
          python quality/check_crap.py rust work/rust-metrics.json work/rust-coverage.json work/rust-crap.json
          # Independent numerical oracles may intentionally share structure.
          set +e
          quality/rust/node_modules/.bin/jscpd crates --format rust --min-lines 5 --min-tokens 50 --threshold 0 --reporters json --output work/rust-duplicates
          duplicate_status=$?
          set -e
          test -f work/rust-duplicates/jscpd-report.json
          test "$duplicate_status" -le 1
          # Keep the broad lexical inventory, including prose, for review.
          grep -En '\b(Any|unknown)\b' $(cat work/rust-source-files.txt) > work/rust-type-lexical.log || test "$?" -eq 1
          # The compiler resolves implicit types. Reject escape identifiers;
          # full line/documentation comments are prose, not type declarations.
          awk '!/^[[:space:]]*\/\// && /(^|[^[:alnum:]_])(Any|unknown)([^[:alnum:]_]|$)/ { print FILENAME ":" FNR ":" $0; found=1 } END { exit found }' $(cat work/rust-source-files.txt)
      - name: Preserve source-bound raw quality reports
        if: always()
        run: |
          mkdir -p work
          git rev-parse HEAD > work/quality-source-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-quality-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          compression-level: 9
          path: |
            work/quality-source-revision.txt
            work/rust-coverage.json
            work/rust-metrics.json
            work/rust-crap.json
            work/rust-source-files.txt
            work/rust-type-lexical.log
            work/rust-duplicates/jscpd-report.json
      - name: Informational mutation report with complete accounting
        if: github.event_name == 'workflow_dispatch' && inputs.full_mutation_report == true
        run: |
          cargo install cargo-mutants --version 27.1.0 --locked
          set +e
          cargo mutants --workspace --output work/rust-mutations --timeout 180 --build-timeout 300 --jobs 2
          mutation_status=$?
          set -e
          outcomes=work/rust-mutations/mutants.out/outcomes.json
          jq -e '.end_time != null and .total_mutants > 0 and .caught + .unviable + .missed + .timeout == .total_mutants' "$outcomes"
          if test "$mutation_status" -ne 0; then
            jq -e '.missed > 0 or .timeout > 0' "$outcomes" > /dev/null || exit "$mutation_status"
          fi
