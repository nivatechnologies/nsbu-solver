name: Bootstrap checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/verify_design.py --output work/design-checks.json
      - run: python -m unittest discover -s reference/tests -v
      - run: python -m reference.verify_fields > work/reference-fields.json
      - run: python -m reference.verify_steps > work/reference-steps.json
