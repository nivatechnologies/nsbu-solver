name: Repository and reference checks
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-quality.txt
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/verify_design.py --output work/design-checks.json
      - run: python -m reference.verify_fields > work/reference-fields.json
      - run: python -m reference.verify_steps > work/reference-steps.json
      - run: python -m reference.verify_trajectory > work/reference-trajectory.json
      - run: basedpyright
      - name: Per-function complexity and Halstead gates
        run: |
          radon cc -j -s quality reference tools > work/ci-cyclomatic.json
          jq -e '[.. | objects | select(has("complexity") and .type != "class") | .complexity] | max < 22' work/ci-cyclomatic.json
          radon hal -j -f quality reference tools > work/ci-halstead.json
          jq -e '[.. | objects | select(has("difficulty")) | .difficulty] | max < 80' work/ci-halstead.json
          complexipy quality reference tools --max-complexity-allowed 21
      - name: Source size and informational duplication/dead-code reports
        run: |
          git ls-files -- quality reference tools typings | awk '/\.pyi?$/' | LC_ALL=C sort > work/ci-source-files.txt
          test -s work/ci-source-files.txt
          while IFS= read -r path; do awk 'END { exit !(NR < 500) }' "$path"; done < work/ci-source-files.txt
          set +e
          pylint --disable=all --enable=duplicate-code --output-format=json quality reference tools > work/ci-duplicates.json
          pylint_status=$?
          set -e
          jq -e 'type == "array"' work/ci-duplicates.json
          if (( pylint_status & 35 )); then exit "$pylint_status"; fi
          set +e
          vulture quality reference tools > work/ci-dead-code.txt
          vulture_status=$?
          set -e
          test "$vulture_status" -eq 0 -o "$vulture_status" -eq 3
      - name: 80 percent executable line and branch coverage; CRAP
        run: |
          coverage erase
          # Includes the complete reference suite, bootstrap tests and quality-tool tests.
          coverage run -m pytest -q
          coverage combine
          coverage json
          coverage report --fail-under=80
          jq -e '.totals | .num_statements > 0 and .num_branches > 0 and (.covered_lines / .num_statements) >= 0.8 and (.covered_branches / .num_branches) >= 0.8' work/full-coverage.json
          python quality/check_crap.py python work/ci-cyclomatic.json work/full-coverage.json work/python-crap.json
      - name: Historical mutation evidence
        run: |
          jq -e 'type == "object"' evidence/quality-reference/mutations/summary.json
