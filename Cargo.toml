[workspace]
members = [
    "crates/nsbu-solver",
    "crates/nsbu-benchmarks",
    "crates/nsbu-cli",
    "crates/m512-alloc-trace",
    "crates/p10-n256-m512-pair-adapter",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/nivatechnologies/nsbu-solver"

[workspace.dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
num-complex = { version = "=0.4.6", default-features = false }
rustfft = { version = "=6.4.1", default-features = false, features = ["avx"] }
rayon = { version = "=1.12.0", default-features = false }
nsbu-solver = { path = "crates/nsbu-solver", version = "=0.1.0-alpha.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"

# Numerical integration/FFT tests exercise the same contracts with optimized loops.
# The test profile retains debug assertions and overflow checks; no tests are omitted.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
